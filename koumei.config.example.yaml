# ============================================================
# koumei-ai-team-framework 設定ファイル
# ============================================================
# このファイルをプロジェクトルートに koumei.config.yaml としてコピーし、
# プロジェクトに合わせて編集してください。
# setup.sh がこの設定を読み込み、テンプレートを展開します。
# 設定変更後は setup.sh --update で再展開してください（TEAM.md 等は生成ファイルです）。

# === プロジェクト基本情報 ===
project:
  name: "my-project"
  description: "プロジェクトの概要を記述"
  path: "."

# === 移行プロジェクト設定（任意） ===
# 既存システムからの移行プロジェクトの場合に設定
migration:
  enabled: false
  source_path: ""                    # 移行元プロジェクトのパス
  source_framework: ""               # 例: "Nuxt 2", "Rails 5", "jQuery"
  target_framework: ""               # 例: "Next.js 15", "Rails 7", "React"

# === ロール構成 ===
# コアロール（koumei, tech-lead, devils-advocate）は必須
# オプションロールはコメント解除で有効化
roles:
  - koumei
  - tech-lead
  - devils-advocate
  # - analyst                        # 既存コード分析担当
  # - inquisitor                     # 設計前の詰問担当（諫議大夫）
  # - ux-designer                    # UI/UX設計担当
  # - scribe                         # 成果物の圧縮・構造化担当（主簿）

# === スキルコマンド設定 ===
# 対象CLI: "claude"（.claude/skills + CLAUDE.md）または "codex"（.codex/skills + AGENTS.md）または "antigravity"（.agents/skills + AGENTS.md）
# Hooks は claude / antigravity（.agents/hooks.json）、マルチタスクは claude ターゲットのみ展開される
target_cli: "claude"
# スキルコマンドの接頭辞（例: /koumei-start, /km-start, /dev-start）
skill_prefix: "koumei"

# === 指揮者設定 ===
commander:
  name: "諸葛孔明"                   # 最高指揮者（koumei）のコードネーム

# === 各ロール モデル設定 ===
# tech-lead はフェーズ分割（設計/実装）。
# 配置の原則: 高単価モデルは「トークン量が多い場所」ではなく「判断のレバレッジが高く出力が小さい場所」に置く
# - devils-advocate: レビューVERDICTがフロー全体を制御する品質ゲート → 最上位モデル
# - tech-lead-design: 設計ミスは実装で増幅される → 最上位モデル
# - inquisitor: 「何を問わなかったか」は誰にも検知できない。問いの質が下流の設計精度を決める → 最上位モデル
# - tech-lead-implement: トークン量が多い → 1段下のモデル（または agy などの外部CLI委譲）
# 外部CLI委譲に対応しているのは analyst（Phase 1）と tech-lead-implement（Phase 5）の二つ。
# 選ぶ基準は出力量ではなく入力量（agy は1呼び出しあたり14〜16k の固定費を持つ）。詳細は docs/configuration.md
# - scribe: 要約・選別は理解を要し、取りこぼしは下流で検知できない → 中位モデル（haiku は重い資料の書き出しで停止する実測あり）
# 指定可能な値: haiku / sonnet / opus / fable（またはフルモデルID）、TEAM.md の外部CLIモデル定義に登録した名前（agy / codex 等）
models:
  koumei: "sonnet"
  analyst: "sonnet"
  inquisitor: "fable"
  ux-designer: "sonnet"
  tech-lead-design: "fable"
  tech-lead-implement: "opus"
  devils-advocate: "fable"
  scribe: "sonnet"

# === レビュー設定 ===
review:
  mode: "default"                    # default（codex→claude） | economy（codex→lmstudio→claude） | claude-only
  timeout: 600                       # 外部CLIレビューのタイムアウト（秒）。超過で次順位モデルにフォールバック

# === 詰問設定（inquisitor ロール有効時に使用） ===
# 設計前に要件・前提・境界条件を詰問する Phase 2.5 の挙動を制御する
grilling:
  max_rounds: 3                      # 詰問の最大ラウンド数。論点が出尽くせば早期終了する
  escalate: "high"                   # high  = 根拠なき前提のうちリスク「高」のものだけユーザーに確認して停止
                                      # none  = 一切停止せず、AI判断で確定させて design-brief に明記して進む
                                      # 夜間バッチ等の無人実行では none を推奨

# === 課題管理システム連携（任意） ===
# 無人運転（/koumei-start --unattended）で消費される。
# 接続手段（MCP・CLI・API）は枠組みの管轄外。実行環境が備えるものを使う前提で、
# ここで定めるのは「どこから引き、いつ何処へ動かすか」のみ。
# このセクションを書かなければ連携は一切行われない（既存プロジェクトはそのまま動く）
ticket:
  enabled: false
  # 無人運転が引く行列の条件。必ず自分の担当に絞ること。
  # 絞らなければ他の担当者のチケットまで夜中に処理してしまうため、
  # 空欄のまま enabled: true にしても連携は無効として扱われる
  # ※ 引用符や # を含むため、必ず | ブロック形式で記述すること
  #   （プレーンスカラーだと yq 無し環境で引用符が剥がれ、検索条件が壊れる）
  # queue: |
  #   status = "AI-READY" AND assignee = currentUser()
  queue: ""
  # この現場で実際に使われている状態名を書く。空欄の項目は遷移させない
  status_designing: ""               # 分析・詰問・設計フェーズの間      例: "AI-PLANREVIEW"
  status_implementing: ""            # 実装・コードレビューフェーズの間  例: "AI-PROGRESS"
  status_review_ready: ""            # AIの作業完了・PR待ち              例: "AI-PR"
  status_parked: ""                  # 待避（AIが判断できず手を止めた）  例: "ペンディング"
  # Phase 7 の STAGING確認チェックリストの判定先。
  # 判定は「合格・不合格・保留」の三つの行き先を持つ。
  # status_staging_ok / status_staging_ng / status_parked の三つが揃ったときだけ、
  # チェックリストの判定が状態遷移の指示として生成される。
  # 一つでも空なら、判定は「その現場の言葉で書く」一般形のまま出る
  status_staging_ok: ""              # ステージング確認 合格             例: "本番デプロイ待ち"
  status_staging_ng: ""              # ステージング確認 不合格（差し戻し）例: "PR実装の差し戻し"

# === 技術スタック ===
tech_stack:
  language: "TypeScript"
  framework: "Next.js 15"
  ui_library: ""                     # 例: "shadcn/ui", "MUI", "Ant Design"
  styling: ""                        # 例: "Tailwind CSS v4", "CSS Modules"
  database: ""                       # 例: "Firestore", "PostgreSQL", "MongoDB"
  testing: ""                        # 例: "Vitest", "Jest", "pytest"
  build_command: "npm run build"
  test_command: "npm run test"
  check_command: ""                  # lint/format チェック（PR前に実行）。例: "npm run check"（Biome）, "npm run lint"
                                      # 空の場合はチェック工程をスキップ（lint未導入プロジェクトでも安全）

# === Git運用 ===
git:
  main_branch: "main"
  develop_branch: "develop"          # 空文字の場合、mainに直接マージ
  branch_pattern: "feature/task-{number}-{summary}"
  dev_rules: ""                      # TEAM.md の開発規約に追記する行（任意）
                                      # ※ # や引用符を含む値・複数行は必ず | ブロック形式で記述すること
                                      #   （プレーンスカラーだと yq 無し環境で # 以降が切り捨てられる）

# === 成果物の出力設定 ===
# 作業成果物（分析・設計・レビュー・報告）は .agents/ 配下の各ワークスペースに置かれる
# output.dir は公式ドキュメント（要件・仕様・設計のまとめ）の出力先
output:
  dir: "docs-official"                    # 公式ドキュメントの出力ディレクトリ（プロジェクトルート相対）
  format: "md"                            # 出力形式（現在は md のみ）
  instructions: ""                        # 公式ドキュメントに関する追加指示（任意・複数行は | ブロック形式で）
                                          # 記入例:
                                          #   instructions: |
                                          #     - 同フォルダ内の既存 .md ファイルの書き方を参考にすること
                                          #     - 見出しレベルは ## から開始すること

# === カスタム指示（各ロールの指示ファイル末尾に追記される） ===
custom_instructions:
  koumei: ""
  tech-lead: ""       # プロジェクト固有の技術指示（複数行は | ブロック形式で）
                      # 記入例: - RSC ファースト: Server Components をデフォルト
  devils-advocate: "" # プロジェクト固有のレビュー観点（複数行は | ブロック形式で）
                      # 記入例: - OWASP Top 10 を重点レビュー
  analyst: ""
  inquisitor: ""  # プロジェクト固有の詰問観点（複数行は | ブロック形式で）
                  # 記入例: - 課金・請求に関わる論点は必ずリスク「高」として扱うこと
  ux-designer: ""
  scribe: ""      # プロジェクト固有の圧縮・構造化ルール（複数行は | ブロック形式で）
                  # 記入例: - 監査要件に関わる記述は appendix へ送らず必ず本文に残すこと

# === 参照ドキュメント ===
# 各ロールが参照すべきドキュメントのリスト
reference_docs: []
  # - path: "docs/architecture.md"
  #   description: "アーキテクチャ設計書"
  # - path: "AGENTS.md"
  #   description: "プロジェクト全体指針"
